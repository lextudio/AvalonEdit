name: Build and publish LibreWPF AvalonEdit

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  NuGetPackageSourceCredentials_openavalon-github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic

jobs:
  validate:
    name: Validate (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-2025
            test: true
          - name: macos-arm64
            runner: macos-15
            test: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - name: Prepare GitHub Packages restore access
        shell: pwsh
        run: |
          Copy-Item NuGet.config "$env:RUNNER_TEMP/NuGet.config"
          dotnet nuget update source openavalon-github --username $env:GITHUB_ACTOR --password $env:GITHUB_TOKEN --store-password-in-clear-text --configfile "$env:RUNNER_TEMP/NuGet.config"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore
        shell: pwsh
        run: |
          dotnet restore ICSharpCode.AvalonEdit/ICSharpCode.AvalonEdit.csproj --configfile "$env:RUNNER_TEMP/NuGet.config"
          dotnet restore ICSharpCode.AvalonEdit.Tests/ICSharpCode.AvalonEdit.Tests.csproj --configfile "$env:RUNNER_TEMP/NuGet.config"
      - name: Build
        run: dotnet build ICSharpCode.AvalonEdit/ICSharpCode.AvalonEdit.csproj -c Release --no-restore
      - name: Pack
        shell: pwsh
        run: |
          dotnet pack ICSharpCode.AvalonEdit/ICSharpCode.AvalonEdit.csproj -c Release --no-build -o nupkg
          [xml]$project = Get-Content ICSharpCode.AvalonEdit/ICSharpCode.AvalonEdit.csproj
          $version = @($project.Project.PropertyGroup | Where-Object { $_.Version })[0].Version
          $packages = @(Get-ChildItem nupkg/ICSharpCode.AvalonEdit.LibreWPF.*.nupkg)
          if ($packages.Count -ne 1 -or $packages[0].Name -ne "ICSharpCode.AvalonEdit.LibreWPF.$version.nupkg") {
            throw "Expected exactly ICSharpCode.AvalonEdit.LibreWPF.$version.nupkg, found: $($packages.Name -join ', ')."
          }
      - name: Upload validated package
        if: matrix.name == 'windows-x64'
        uses: actions/upload-artifact@v7
        with:
          name: avalonedit-nupkg
          path: nupkg/ICSharpCode.AvalonEdit.LibreWPF.*.nupkg
          if-no-files-found: error
      - name: Test
        if: matrix.test
        run: dotnet test ICSharpCode.AvalonEdit.Tests/ICSharpCode.AvalonEdit.Tests.csproj -c Release --no-restore

  publish:
    name: Publish GitHub Package
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - name: Download validated package
        uses: actions/download-artifact@v8
        with:
          name: avalonedit-nupkg
          path: nupkg
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $expected = "$env:GITHUB_REF_NAME".Substring(1)
          $package = Get-ChildItem nupkg/ICSharpCode.AvalonEdit.LibreWPF.*.nupkg -ErrorAction Stop
          if ($package.Name -ne "ICSharpCode.AvalonEdit.LibreWPF.$expected.nupkg") {
            throw "Tag $env:GITHUB_REF_NAME does not match validated package $($package.Name)."
          }
      - name: Push public package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push nupkg/ICSharpCode.AvalonEdit.LibreWPF.*.nupkg --api-key $env:GITHUB_TOKEN --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate
